  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /* Global Variables from Environment */
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'winchester-mystery-default';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : { apiKey: "mock", projectId: "mock" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let roomUnsubscribe = null;

    /* Authenticate First */
    async function initAuthentication() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
      } catch (err) {
        console.warn("Auth error fallback to anonymous", err);
        try {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        } catch (e) {
          console.error("Auth completely failed", e);
        }
      }
      window.multiplayerEngine.onAuthReady(currentUser);
    }

    /* Expose DB Helpers to Engine */
    window.fStore = {
      db,
      appId,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      onSnapshot,
      collection,
      getAuthUser: () => currentUser
    };

    initAuthentication();
  </script>

      /* Create Room */
      async createRoom() {
        const nick = document.getElementById('inputNickname').value.trim();
        if (!nick) {
          showToast("닉네임을 입력해주세요!");
          return;
        }
        this.myNickname = nick;
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        this.roomCode = code;

        // Initialize Decks
        const initialEvidenceDeck = [...EVIDENCE_DECK].sort(() => Math.random() - 0.5);
        const initialAlibiDecks = {};
        CHARACTERS.forEach(c => {
          initialAlibiDecks[c.id] = JSON.parse(JSON.stringify(ALIBI_CARDS[c.id] || []));
        });

        const initialData = {
          roomCode: code,
          hostUid: this.user.uid,
          status: "lobby", // lobby, playing, ended
          round: 1,
          phase: "investigate", // investigate, discuss, whisper, evidence
          timerSeconds: 300,
          timerRunning: false,
          evidenceDeck: initialEvidenceDeck,
          alibiDecks: initialAlibiDecks,
          whisperGroup: [], // [charId1, charId2]
          whisperRevealedCard: null, // { card, fromCharId, revealedBy }
          votes: {}, // { voterCharId: targetCharId }
          players: {
            [this.user.uid]: {
              uid: this.user.uid,
              nickname: nick,
              charId: null,
              isHost: true,
              heldAlibis: [],
              heldEvidences: []
            }
          }
        };

        const { db, appId, doc, setDoc } = window.fStore;
        // Strictly use RULE 1 path: artifacts/{appId}/public/data/rooms/{code}
        this.roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);

        try {
          await setDoc(this.roomRef, initialData);
          this.listenToRoom();
        } catch (err) {
          console.error("Room creation error:", err);
          showToast("방 생성에 실패했습니다: " + err.message);
        }
      },

      /* Join Room */
      async joinRoom() {
        const nick = document.getElementById('inputNickname').value.trim();
        const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();

        if (!nick) {
          showToast("닉네임을 입력해주세요!");
          return;
        }
        if (!code) {
          showToast("방 코드를 입력해주세요!");
          return;
        }

        this.myNickname = nick;
        this.roomCode = code;

        const { db, appId, doc, getDoc, updateDoc } = window.fStore;
        this.roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);

        try {
          const snap = await getDoc(this.roomRef);
          if (!snap.exists()) {
            showToast("존재하지 않는 방 코드입니다.");
            return;
          }
          const data = snap.data();
          if (data.status !== "lobby" && !data.players[this.user.uid]) {
            showToast("이미 게임이 진행 중인 방입니다.");
            return;
          }

          if (!data.players[this.user.uid]) {
            const updatedPlayers = { ...data.players };
            updatedPlayers[this.user.uid] = {
              uid: this.user.uid,
              nickname: nick,
              charId: null,
              isHost: false,
              heldAlibis: [],
              heldEvidences: []
            };
            await updateDoc(this.roomRef, { players: updatedPlayers });
          }

          this.listenToRoom();
        } catch (err) {
          console.error("Join error:", err);
          showToast("방 입장에 실패했습니다: " + err.message);
        }
      },

      /* Real-time Room Sync Listener */
      listenToRoom() {
        if (this.unsubscribe) this.unsubscribe();

        document.getElementById('roomBadge').classList.remove('hidden');
        document.getElementById('displayRoomCode').innerText = this.roomCode;

        this.unsubscribe = window.fStore.onSnapshot(this.roomRef, (docSnap) => {
          if (!docSnap.exists()) {
            showToast("방이 삭제되었거나 존재하지 않습니다.");
            this.renderHome();
            return;
          }

          this.roomData = docSnap.data();
          const me = this.roomData.players[this.user.uid];
          if (me) {
            this.myCharId = me.charId;
          }

          // Route to appropriate view
          if (this.roomData.status === "lobby") {
            this.renderLobby();
          } else if (this.roomData.status === "playing") {
            this.renderInGame();
          } else if (this.roomData.status === "ended") {
            this.renderEnding();
          }
        }, (error) => {
          console.error("Firestore sync error:", error);
          showToast("실시간 연결 오류: " + error.message);
        });
      },

      /* Pick Character in Lobby */
      async pickCharacter(charId) {
        if (!this.roomData) return;
        const players = this.roomData.players;

        // Check if taken by someone else
        for (const uid in players) {
          if (players[uid].charId === charId && uid !== this.user.uid) {
            showToast("이미 다른 플레이어가 선택한 캐릭터입니다!");
            return;
          }
        }

        const myEntry = { ...players[this.user.uid], charId: charId };
        const updatedPlayers = { ...players, [this.user.uid]: myEntry };

        try {
          await window.fStore.updateDoc(this.roomRef, { players: updatedPlayers });
        } catch (err) {
          showToast("캐릭터 선택 실패: " + err.message);
        }
      },

      /* Start Game (Host only) */
      async startGame() {
        const players = Object.values(this.roomData.players);
        const unassigned = players.some(p => !p.charId);

        if (players.length < 2) {
          showToast("최소 2명 이상의 플레이어가 필요합니다!");
          return;
        }
        if (unassigned) {
          showToast("모든 플레이어가 캐릭터를 선택해야 시작할 수 있습니다!");
          return;
        }

        try {
          await window.fStore.updateDoc(this.roomRef, {
            status: "playing",
            round: 1,
            phase: "investigate",
            timerSeconds: 180,
            timerRunning: true
          });
          triggerThunderSound();
        } catch (err) {
          showToast("게임 시작 오류: " + err.message);
        }
      },

          1: "제 1 라운드: 서재의 변사체와 피 묻은 촛대",
          2: "제 2 라운드: 닫힌 방의 밀담과 의혹의 시선",
          3: "제 3 라운드: 찢겨진 진료부와 깨진 알리바이",
          4: "제 4 라운드: 음모의 연합과 두 번째 밀담",
          5: "제 5 라운드: 폭풍의 종막과 최후의 고발"
        };

        const phaseDesc = {
          investigate: "🔍 [알리바이 조사] 타인의 비공개 알리바이 카드를 1장 뽑아 확인하세요 (본인 카드는 확인 불가).",
          discuss: "🗣️ [전체 토론] 발견한 카드를 '말로만' 설명하며 모순을 찾으세요 (실물 카드 공개 금지).",
          whisper: "🤫 [밀담 시간] 2~3인이 별도 통화/대화로 모여 '알리바이 카드 실물'을 보여주며 거래할 수 있습니다!",
          evidence: "📦 [증거 수색] 라운드가 종료되었습니다! 저택 구석구석을 수색해 단서 1개를 획득하세요."
        };

        container.innerHTML = `
          <div class="w-full space-y-5">
            <!-- Top Status Bar -->
            <div class="bg-parchment rounded-xl p-4 wood-border flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="text-amber-500 font-cinzel text-xs font-bold tracking-widest uppercase">Round ${rData.round} / 5</span>
                <h2 class="text-lg sm:text-xl font-bold text-amber-100">${roundTitles[rData.round]}</h2>
                <p class="text-xs text-amber-300/80 mt-0.5">${phaseDesc[rData.phase]}</p>
              </div>

              <div class="flex items-center gap-3">
                <div class="text-center px-4 py-2 bg-black/60 rounded-xl border border-amber-900/60">
                  <span class="text-[10px] text-zinc-400 block font-cinzel uppercase">Time Remaining</span>
                  <span id="syncedTimer" class="font-mono text-2xl font-black text-amber-300">
                    ${this.formatTime(rData.timerSeconds)}
                  </span>
                </div>

                ${isHost ? `
                  <div class="flex flex-col gap-1">
                    ${this.renderHostControls(rData)}
                  </div>
                ` : `
                  <div class="text-right">
                    <span class="text-[11px] text-zinc-400 block">방장 조작 대기 중</span>
                    <span class="text-xs text-amber-400 font-semibold">페이즈: ${rData.phase}</span>
                  </div>
                `}
              </div>
            </div>

            <!-- Player Profile & Secret Recall Bar -->
            <div class="bg-zinc-900/90 rounded-xl p-3 border border-zinc-800 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="text-3xl">${myChar.avatar}</span>
                <div>
                  <span class="text-xs text-zinc-400 block">당신의 역할:</span>
                  <span class="font-bold text-amber-200 text-sm sm:text-base">${myChar.name}</span>
                  <span class="text-xs text-zinc-400 ml-1">(${myChar.role})</span>
                </div>
              </div>
              <button onclick="openCharacterSheet('${myChar.id}')" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 text-xs text-amber-300 flex items-center gap-1.5">
                <i class="ph ph-lock-key"></i> 내 비밀/타임라인 다시보기
              </button>
            </div>

            <!-- In-Game Grid Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
              <!-- Left 2 Cols: Phase Interactions -->
              <div class="lg:col-span-2 space-y-5">
                ${this.renderPhaseContent(rData, myPlayer, myChar)}
              </div>

              <!-- Right 1 Col: Inventory -->
              <div class="space-y-4">
                ${this.renderInventory(myPlayer, myChar)}
              </div>
            </div>
          </div>
        `;
      },

      /* Render Host Phase Progression Buttons */
      renderHostControls(rData) {
        if (rData.phase === "investigate") {
          return `<button onclick="window.multiplayerEngine.advancePhase('discuss')" class="px-3 py-1.5 rounded bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-bold border border-amber-600">전체 토론 시작 &gt;</button>`;
        }
        if (rData.phase === "discuss") {
          if (rData.round === 2 || rData.round === 4) {
            return `<button onclick="window.multiplayerEngine.advancePhase('whisper')" class="px-3 py-1.5 rounded bg-purple-900 hover:bg-purple-800 text-purple-100 text-xs font-bold border border-purple-600">밀담 시간 시작 &gt;</button>`;
          } else {
            return `<button onclick="window.multiplayerEngine.advancePhase('evidence')" class="px-3 py-1.5 rounded bg-emerald-900 hover:bg-emerald-800 text-emerald-100 text-xs font-bold border border-emerald-600">단서 수색 시작 &gt;</button>`;
          }
        }
        if (rData.phase === "whisper") {
          return `<button onclick="window.multiplayerEngine.advancePhase('evidence')" class="px-3 py-1.5 rounded bg-emerald-900 hover:bg-emerald-800 text-emerald-100 text-xs font-bold border border-emerald-600">밀담 종료 & 수색 &gt;</button>`;
        }
        if (rData.phase === "evidence") {
          if (rData.round < 5) {
            return `<button onclick="window.multiplayerEngine.nextRound()" class="px-3 py-1.5 rounded bg-red-950 hover:bg-red-900 text-amber-200 text-xs font-bold border border-amber-600">${rData.round + 1}R 시작 &gt;</button>`;
          } else {
            return `<button onclick="window.multiplayerEngine.startFinalVote()" class="px-3 py-1.5 rounded bg-red-950 hover:bg-red-900 text-amber-200 text-xs font-bold border border-amber-600">최종 투표 진행 &gt;</button>`;
          }
        }
        return '';
      },

      /* Phase Interactive Area */
      renderPhaseContent(rData, myPlayer, myChar) {
        if (rData.phase === "investigate") {
          return this.renderInvestigateGrid(rData, myPlayer);
        }
        if (rData.phase === "discuss") {
          return this.renderDiscussView();
        }
        if (rData.phase === "whisper") {
          return this.renderWhisperView(rData, myPlayer);
        }
        if (rData.phase === "evidence") {
          return this.renderEvidenceView(rData, myPlayer);
        }
        return '';
      },

      /* Phase 1: Investigate Blind Alibis */
      renderInvestigateGrid(rData, myPlayer) {
        const alibiDecks = rData.alibiDecks || {};
        const players = Object.values(rData.players);

        return `
          <div class="bg-parchment rounded-xl p-5 wood-border space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-amber-200 text-sm sm:text-base flex items-center gap-2">
                <i class="ph ph-cards text-amber-400"></i> 각 용의자의 비공개 알리바이 덱
              </h3>
              <span class="text-xs text-zinc-400">자신을 제외한 인물의 카드를 1장 뽑을 수 있습니다</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${players.map(p => {
                const char = CHARACTERS.find(c => c.id === p.charId);
                if (!char) return '';
                const deck = alibiDecks[char.id] || [];
                const isSelf = p.uid === this.user.uid;

                return `
                  <div class="p-3.5 rounded-xl bg-black/40 border ${isSelf ? 'border-zinc-800 opacity-60' : 'border-amber-900/50 hover:border-amber-600'} transition flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                          <span class="text-xl">${char.avatar}</span>
                          <div>
                            <span class="font-bold text-xs text-amber-100 block">${char.name}</span>
                            <span class="text-[10px] text-zinc-400">담당: ${p.nickname}</span>
                          </div>
                        </div>
                        <span class="text-[11px] px-2 py-0.5 rounded bg-zinc-900 text-zinc-400 border border-zinc-800">남은 알리바이: ${deck.length}장</span>
                      </div>
                    </div>

                    <div class="mt-3 pt-2 border-t border-zinc-800">
                      ${isSelf ? `
                        <span class="text-[11px] text-zinc-500 italic block text-center py-1">자신의 알리바이는 볼 수 없습니다</span>
                      ` : deck.length === 0 ? `
                        <span class="text-[11px] text-zinc-600 italic block text-center py-1">모든 카드가 소진됨</span>
                      ` : `
                        <button onclick="window.multiplayerEngine.drawAlibi('${char.id}')" class="w-full py-1.5 rounded bg-amber-950/80 hover:bg-amber-900 border border-amber-700 text-amber-200 text-xs font-semibold flex items-center justify-center gap-1">
                          <i class="ph ph-hand-pointing"></i> 1장 비공개 조사하기
                        </button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      async drawAlibi(targetCharId) {
        const rData = this.roomData;
        const deck = [...(rData.alibiDecks[targetCharId] || [])];
        if (deck.length === 0) {
          showToast("더 이상 남은 카드가 없습니다.");
          return;
        }

        const card = deck.shift();
        const myPlayer = { ...rData.players[this.user.uid] };
        myPlayer.heldAlibis = [...(myPlayer.heldAlibis || []), { ...card, fromCharId: targetCharId }];

        const updatedAlibiDecks = { ...rData.alibiDecks, [targetCharId]: deck };
        const updatedPlayers = { ...rData.players, [this.user.uid]: myPlayer };

        try {
          await window.fStore.updateDoc(this.roomRef, {
            alibiDecks: updatedAlibiDecks,
            players: updatedPlayers
          });

          const targetChar = CHARACTERS.find(c => c.id === targetCharId);
          showModal(`
            <div class="space-y-4 text-center">
              <div class="inline-block p-3 rounded-full bg-amber-950 border border-amber-600 text-amber-300">
                <i class="ph ph-eye text-3xl"></i>
              </div>
              <h3 class="text-base font-bold text-amber-100">${targetChar.name}의 알리바이 단서 입수!</h3>
              <div class="bg-black/60 rounded-xl p-4 border border-amber-700 text-left space-y-2">
                <h4 class="font-bold text-amber-300 text-sm">${card.title}</h4>
                <p class="text-xs text-zinc-300 leading-relaxed">${card.desc}</p>
              </div>
              <p class="text-[11px] text-zinc-400">
                * 이 단서는 당신의 비밀 보관함에 저장되었습니다.<br>
                * 토론 시에는 말로만 설명할 수 있으며, <b>밀담 시간(2R, 4R)</b>에만 상대에게 실물 카드로 보여줄 수 있습니다!
              </p>
              <button onclick="closeModal()" class="px-6 py-2 rounded bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-bold">
                확인 및 보관함에 넣기
              </button>
            </div>
          `);
        } catch (err) {
          showToast("카드 뽑기 오류: " + err.message);
        }
      },

      /* Phase 2: Discussion */
      renderDiscussView() {
        return `
          <div class="bg-parchment rounded-xl p-5 wood-border space-y-4">
            <div class="flex items-center gap-3">
              <div class="p-2.5 rounded-lg bg-amber-950/80 border border-amber-600 text-amber-400">
                <i class="ph ph-chats-circle text-2xl"></i>
              </div>
              <div>
                <h3 class="font-bold text-amber-200 text-base">전체 토론 및 심문</h3>
                <p class="text-xs text-zinc-400">음성 채팅이나 대면으로 각자가 획득한 단서와 모순점을 심문하세요.</p>
              </div>
            </div>

            <div class="bg-black/50 rounded-xl p-4 border border-zinc-800 space-y-3 text-xs leading-relaxed text-zinc-300">
              <p>• <b>실물 카드 공개 금지:</b> 이 시간에는 소지한 카드를 화면으로 보여줄 수 없습니다. 오직 자신의 언변과 진술로 설득해야 합니다.</p>
              <p>• <b>모순점 추궁:</b> 범인은 자신의 알리바이를 조작하여 말할 수 있습니다. 다른 사람이 조사한 단서와 비교해 거짓말을 파헤치세요.</p>
            </div>
          </div>
        `;
      },

      /* Phase 3: Whisper Room (2R, 4R) */
      renderWhisperView(rData, myPlayer) {
        const whisperGroup = rData.whisperGroup || [];
        const isMember = whisperGroup.includes(myPlayer.charId);
        const revealedCard = rData.whisperRevealedCard;

        return `
          <div class="bg-parchment rounded-xl p-5 wood-border space-y-4">
            <div class="flex items-center justify-between border-b border-purple-900/40 pb-3">
              <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-lg bg-purple-950 border border-purple-600 text-purple-300">
                  <i class="ph ph-shield-warning text-2xl"></i>
                </div>
                <div>
                  <h3 class="font-bold text-purple-200 text-base">밀담의 방 (비밀 회동)</h3>
                  <p class="text-xs text-zinc-400">2~3명을 선택해 밀담 그룹을 결성하세요. 이 방에서만 <b>알리바이 카드 실물 공개</b>가 가능합니다!</p>
                </div>
              </div>
            </div>

            <!-- Group Formation -->
            <div class="bg-black/40 rounded-xl p-4 border border-purple-900/40 space-y-3">
              <span class="text-xs font-bold text-purple-300 block">밀담 참가자 선택 (최대 3명):</span>
              <div class="flex flex-wrap gap-2">
                ${CHARACTERS.map(c => {
                  const selected = whisperGroup.includes(c.id);
                  return `
                    <button onclick="window.multiplayerEngine.toggleWhisperMember('${c.id}')" class="px-3 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 transition ${selected ? 'bg-purple-950 border-purple-400 text-purple-200 font-bold' : 'bg-zinc-900 border-zinc-700 text-zinc-400'}">
                      <span>${c.avatar}</span> ${c.name}
                      ${selected ? '<i class="ph ph-check-circle text-purple-400"></i>' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Whisper Reveal Desk -->
            ${isMember ? `
              <div class="p-4 rounded-xl bg-purple-950/20 border border-purple-800/60 space-y-3">
                <span class="text-xs font-bold text-purple-300 block">밀담 참가자 전원에게 알리바이 카드 실물 공개하기:</span>
                ${(myPlayer.heldAlibis || []).length === 0 ? `
                  <p class="text-xs text-zinc-500 italic">공개할 알리바이 카드가 없습니다.</p>
                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${(myPlayer.heldAlibis || []).map(card => `
                      <div class="bg-black/60 rounded-lg p-2.5 border border-purple-700/50 flex flex-col justify-between">
                        <div>
                          <span class="text-xs font-bold text-amber-300">${card.title}</span>
                          <p class="text-[11px] text-zinc-400 mt-0.5 line-clamp-2">${card.desc}</p>
                        </div>
                        <button onclick="window.multiplayerEngine.revealCardInWhisper('${card.id}')" class="mt-2 py-1 rounded bg-purple-900 hover:bg-purple-800 text-purple-200 border border-purple-600 text-xs font-semibold flex items-center justify-center gap-1">
                          <i class="ph ph-eye"></i> 이 방에 실물 공개
                        </button>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

              <!-- Shared Card Display in Room -->
              ${revealedCard ? `
                <div class="p-4 rounded-xl bg-black/80 border-2 border-purple-500 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-[11px] text-purple-300 font-bold uppercase tracking-wider">
                      [실시간 공개된 증거] 공개자: ${revealedCard.revealedByName}
                    </span>
                    <button onclick="window.multiplayerEngine.clearRevealedCard()" class="text-xs text-zinc-400 hover:text-white">닫기</button>
                  </div>
                  <h4 class="font-bold text-amber-300 text-sm">${revealedCard.card.title}</h4>
                  <p class="text-xs text-zinc-200 leading-relaxed">${revealedCard.card.desc}</p>
                </div>
              ` : ''}
            ` : `
              <div class="p-4 rounded-xl bg-black/50 border border-zinc-800 text-center py-6 text-xs text-zinc-400">
                현재 밀담 그룹에 참여하고 있지 않습니다. 다른 플레이어들의 비밀 대화가 끝날 때까지 대기하세요.
              </div>
            `}
          </div>
        `;
      },

      async toggleWhisperMember(charId) {
        const group = [...(this.roomData.whisperGroup || [])];
        const idx = group.indexOf(charId);
        if (idx > -1) {
          group.splice(idx, 1);
        } else {
          if (group.length >= 3) {
            showToast("밀담은 최대 3인까지만 참여 가능합니다.");
            return;
          }
          group.push(charId);
        }

        try {
          await window.fStore.updateDoc(this.roomRef, { whisperGroup: group, whisperRevealedCard: null });
        } catch (err) {
          showToast("밀담 그룹 수정 실패: " + err.message);
        }
      },

      async revealCardInWhisper(cardId) {
        const myPlayer = this.roomData.players[this.user.uid];
        const card = myPlayer.heldAlibis.find(c => c.id === cardId);
        if (!card) return;

        try {
          await window.fStore.updateDoc(this.roomRef, {
            whisperRevealedCard: {
              card,
              fromCharId: card.fromCharId,
              revealedByName: myPlayer.nickname
            }
          });
        } catch (err) {
          showToast("카드 공개 실패: " + err.message);
        }
      },

      async clearRevealedCard() {
        try {
          await window.fStore.updateDoc(this.roomRef, { whisperRevealedCard: null });
        } catch (err) {}
      },

      /* Phase 4: Evidence Draw */
      renderEvidenceView(rData, myPlayer) {
        const myEvidences = myPlayer.heldEvidences || [];
        const hasDrawn = myEvidences.length >= rData.round;

        return `
          <div class="bg-parchment rounded-xl p-5 wood-border space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-lg bg-emerald-950 border border-emerald-600 text-emerald-300">
                  <i class="ph ph-magnifying-glass text-2xl"></i>
                </div>
                <div>
                  <h3 class="font-bold text-emerald-200 text-base">라운드 종료 현장 수색</h3>
                  <p class="text-xs text-zinc-400">저택 곳곳에 숨겨진 24종의 단서 덱에서 증거물품을 1장 수집합니다.</p>
                </div>
              </div>
              <span class="text-xs text-emerald-400 bg-emerald-950/50 px-2.5 py-1 rounded border border-emerald-800">
                남은 증거 더미: ${(rData.evidenceDeck || []).length}개
              </span>
            </div>

            <div class="p-6 rounded-xl bg-black/60 border border-emerald-900/50 text-center space-y-3">
              <div class="text-4xl text-amber-400"><i class="ph ph-archive-box"></i></div>
              <h4 class="font-bold text-amber-200 text-sm">${myPlayer.nickname}의 ${rData.round}라운드 단서 수색</h4>
              ${hasDrawn ? `
                <p class="text-xs text-emerald-400 font-semibold">이번 라운드 단서를 이미 획득하셨습니다! 소지품을 확인하세요.</p>
              ` : `
                <p class="text-xs text-zinc-400">덱의 맨 위에서 단서 1개를 무작위로 인출하여 증거 보관함에 넣습니다.</p>
                <button onclick="window.multiplayerEngine.drawEvidence()" class="px-6 py-2.5 rounded-lg bg-emerald-800 hover:bg-emerald-700 text-emerald-100 text-xs font-bold border border-emerald-500 shadow-lg">
                  <i class="ph ph-hand-coins"></i> 단서 1장 뽑기
                </button>
              `}
            </div>
          </div>
        `;
      },

      async drawEvidence() {
        const rData = this.roomData;
        const deck = [...(rData.evidenceDeck || [])];
        if (deck.length === 0) {
          showToast("더 이상 남은 증거물이 없습니다.");
          return;
        }

        const item = deck.shift();
        const myPlayer = { ...rData.players[this.user.uid] };
        myPlayer.heldEvidences = [...(myPlayer.heldEvidences || []), item];

        const updatedPlayers = { ...rData.players, [this.user.uid]: myPlayer };

        try {
          await window.fStore.updateDoc(this.roomRef, {
            evidenceDeck: deck,
            players: updatedPlayers
          });

          showModal(`
            <div class="space-y-4 text-center">
              <div class="inline-block p-3 rounded-full bg-emerald-950 border border-emerald-500 text-emerald-300">
                <i class="ph ph-check text-3xl"></i>
              </div>
              <h3 class="text-base font-bold text-emerald-200">새로운 현장 증거 발견!</h3>
              <div class="bg-black/70 rounded-xl p-4 border border-emerald-700 text-left space-y-2">
                <span class="text-[11px] px-2 py-0.5 rounded bg-emerald-900/60 text-emerald-300 border border-emerald-800">${item.type}</span>
                <h4 class="font-bold text-amber-200 text-sm">${item.name}</h4>
                <p class="text-xs text-zinc-300 leading-relaxed">${item.desc}</p>
              </div>
              <button onclick="closeModal()" class="px-6 py-2 rounded bg-emerald-800 hover:bg-emerald-700 text-emerald-100 text-xs font-bold">
                보관함에 저장
              </button>
            </div>
          `);
        } catch (err) {
          showToast("증거 획득 실패: " + err.message);
        }
      },

      /* Inventory Renderer */
      renderInventory(myPlayer, myChar) {
        const heldAlibis = myPlayer.heldAlibis || [];
        const heldEvidences = myPlayer.heldEvidences || [];

        return `
          <div class="bg-parchment rounded-xl p-4 wood-border space-y-4">
            <h3 class="font-bold text-amber-200 text-xs uppercase tracking-wider flex items-center justify-between border-b border-amber-900/40 pb-2">
              <span><i class="ph ph-briefcase"></i> ${myPlayer.nickname}의 비밀 보관함</span>
              <span class="text-[10px] text-zinc-400">알리바이 ${heldAlibis.length} / 단서 ${heldEvidences.length}</span>
            </h3>

            <!-- Held Alibis -->
            <div class="space-y-2">
              <span class="text-[11px] font-bold text-amber-400 block">획득한 타인의 알리바이 (${heldAlibis.length})</span>
              ${heldAlibis.length === 0 ? `
                <p class="text-[11px] text-zinc-500 italic">아직 뽑은 알리바이 카드가 없습니다.</p>
              ` : `
                <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                  ${heldAlibis.map(c => {
                    const fromChar = CHARACTERS.find(x => x.id === c.fromCharId);
                    return `
                      <div class="bg-black/50 p-2 rounded border border-amber-900/50 text-xs">
                        <div class="flex items-center justify-between text-amber-300 font-semibold">
                          <span>${c.title}</span>
                          <span class="text-[10px] text-zinc-400">${fromChar?.name || ''}</span>
                        </div>
                        <p class="text-[11px] text-zinc-300 mt-0.5">${c.desc}</p>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- Held Physical Evidence -->
            <div class="space-y-2 pt-2 border-t border-zinc-800">
              <span class="text-[11px] font-bold text-emerald-400 block">수집한 현장 증거물품 (${heldEvidences.length})</span>
              ${heldEvidences.length === 0 ? `
                <p class="text-[11px] text-zinc-500 italic">아직 획득한 증거품이 없습니다.</p>
              ` : `
                <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                  ${heldEvidences.map(ev => `
                    <div class="bg-black/50 p-2 rounded border border-emerald-900/40 text-xs">
                      <div class="flex items-center justify-between">
                        <span class="font-semibold text-emerald-200">${ev.name}</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded bg-zinc-900 text-zinc-400">${ev.type}</span>
                      </div>
                      <p class="text-[11px] text-zinc-400 mt-0.5">${ev.desc}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      },

      /* Phase & Round Flow */
      async advancePhase(newPhase) {
        try {
          await window.fStore.updateDoc(this.roomRef, {
            phase: newPhase,
            whisperRevealedCard: null,
            timerSeconds: newPhase === 'discuss' ? 480 : newPhase === 'whisper' ? 300 : 90
          });
          if (newPhase === 'whisper') triggerThunderSound();
        } catch (err) {
          showToast("페이즈 변경 오류: " + err.message);
        }
      },

      async nextRound() {
        const nextR = (this.roomData.round || 1) + 1;
        try {
          await window.fStore.updateDoc(this.roomRef, {
            round: nextR,
            phase: "investigate",
            whisperGroup: [],
            whisperRevealedCard: null,
            timerSeconds: 180
          });
          triggerThunderSound();
        } catch (err) {
          showToast("다음 라운드 진입 오류: " + err.message);
        }
      },

      async startFinalVote() {
        try {
          await window.fStore.updateDoc(this.roomRef, {
            status: "ended",
            phase: "voting"
          });
        } catch (err) {
          showToast("투표 진입 실패: " + err.message);
        }
      },

      /* Final Voting & Multi-Ending Screen */
      renderEnding() {
        const container = document.getElementById('appContent');
        const rData = this.roomData;
        const myPlayer = rData.players[this.user.uid];
        const votes = rData.votes || {};
        const players = Object.values(rData.players);
        const myVote = votes[myPlayer?.charId];

        // Check if all players have voted
        const allVoted = players.every(p => p.charId && votes[p.charId]);

        container.innerHTML = `
          <div class="w-full max-w-4xl bg-parchment rounded-2xl p-6 sm:p-10 wood-border space-y-6 text-center">
            <div class="inline-block p-3 rounded-full bg-red-950 border border-red-600 text-red-400">
              <i class="ph ph-scales text-4xl"></i>
            </div>
            <div>
              <h2 class="font-cinzel text-2xl sm:text-3xl font-extrabold text-amber-200">
                최종 변론 및 범인 지목 투표
              </h2>
              <p class="text-xs sm:text-sm text-zinc-300 mt-1">
                5라운드의 모든 수색과 밀담이 끝났습니다. 각자 최후 변론을 마치고 진범을 투표하세요.
              </p>
            </div>

            <!-- Cast Vote Area -->
            <div class="bg-black/50 rounded-xl p-5 border border-zinc-800 text-left space-y-3">
              <h4 class="font-bold text-amber-300 text-xs flex items-center gap-1.5"><i class="ph ph-gavel"></i> ${myPlayer.nickname} (${CHARACTERS.find(c => c.id === myPlayer.charId)?.name})의 투표</h4>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                ${CHARACTERS.map(c => {
                  const isVotedByMe = myVote === c.id;
                  return `
                    <button onclick="window.multiplayerEngine.submitVote('${c.id}')" class="p-2.5 rounded-lg border text-xs flex items-center justify-between transition ${isVotedByMe ? 'bg-red-950 border-red-500 text-amber-200 font-bold' : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-amber-600'}">
                      <div class="flex items-center gap-2">
                        <span>${c.avatar}</span>
                        <span>${c.name}</span>
                      </div>
                      ${isVotedByMe ? '<span class="text-xs text-red-400 font-bold">선택됨</span>' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Vote Status -->
            <div class="p-4 rounded-xl bg-zinc-950/60 border border-zinc-800 text-xs text-zinc-400">
              투표 완료 인원: ${Object.keys(votes).length} / ${players.length}명
              ${allVoted ? '<span class="text-emerald-400 font-bold ml-2">전원 투표 완료! 개표 결과를 확인하세요.</span>' : '<span class="text-amber-400 ml-2">모든 인원이 투표할 때까지 대기 중...</span>'}
            </div>

            <!-- Tally & Reveal if all voted -->
            ${allVoted ? this.renderOutcome(votes) : ''}
          </div>
        `;
      },

      async submitVote(targetCharId) {
        const myCharId = this.myCharId;
        if (!myCharId) return;

        const updatedVotes = { ...(this.roomData.votes || {}), [myCharId]: targetCharId };
        try {
          await window.fStore.updateDoc(this.roomRef, { votes: updatedVotes });
        } catch (err) {
          showToast("투표 제출 실패: " + err.message);
        }
      },

      renderOutcome(votes) {
        const tally = {};
        for (const voter in votes) {
          const target = votes[voter];
          tally[target] = (tally[target] || 0) + 1;
        }

        let maxCount = -1;
        let arrestedCharId = null;
        for (const charId in tally) {
          if (tally[charId] > maxCount) {
            maxCount = tally[charId];
            arrestedCharId = charId;
          }
        }

        const isCorrect = (arrestedCharId === "elena");
        const arrestedChar = CHARACTERS.find(c => c.id === arrestedCharId);

        return `
          <div class="space-y-6 pt-4 text-left border-t border-zinc-800">
            <div class="text-center space-y-1">
              <span class="text-xs font-bold font-cinzel uppercase tracking-widest ${isCorrect ? 'text-emerald-400' : 'text-red-400'}">
                ${isCorrect ? 'Case Solved - Justice Prevails' : 'Investigation Failed - A Tragedy'}
              </span>
              <h3 class="text-xl sm:text-2xl font-extrabold text-amber-100">
                ${isCorrect ? '《진실의 규명: 주치의의 가면이 벗겨지다》' : '《오판의 파멸: 어둠 속으로 사라진 진범》'}
              </h3>
              <p class="text-xs text-zinc-300">최다 득표자: <b class="text-amber-300">${arrestedChar?.name} (${maxCount}표)</b> 체포</p>
            </div>

            <div class="bg-black/60 rounded-xl p-5 border ${isCorrect ? 'border-emerald-600' : 'border-red-700'} space-y-2 text-xs sm:text-sm text-zinc-200 leading-relaxed">
              <h4 class="font-bold text-amber-300 flex items-center gap-1.5"><i class="ph ph-file-magnifying-glass"></i> 사건의 전말과 명백한 진실</h4>
              <p><b>진범은 주치의 엘레나 바스커빌이었습니다.</b></p>
              <p>
                엘레나는 20:10경 에드워드의 지병 진통제에 지연성 청산가리를 섞어 주사했습니다.
                에드워드는 20:50경 중독 증세로 쓰러지며 촛대와 찻잔을 쳤고, 이 소리를 밖에서 아서가 들었던 것입니다.
                장남 아서는 금고를 털려다 쓰러진 아버지를 보고 도망쳤으며, 집사 찰스는 자신에게 불리한 새 유언장을 소각하려 서재를 훼손했을 뿐 살인을 저지르지 않았습니다.
              </p>
            </div>

            <div class="bg-zinc-950/60 p-5 rounded-xl border border-zinc-800 text-xs sm:text-sm text-zinc-300 leading-relaxed space-y-2">
              ${isCorrect ? `
                <h4 class="font-bold text-emerald-400">엔딩 A : 완벽한 검거와 정의의 심판 (시민 승리)</h4>
                <p>엘레나의 가방 속 독극물 불출 대장 파편과 주사기가 만천하에 드러났습니다. 차디찬 수갑이 채워지자 엘레나는 냉소를 흘리며 속삭였습니다. <i>"10년 전 의료사고를 빌미로 내 삶을 옭아매던 그 악마를 단죄했을 뿐이야..."</i> 폭풍우가 걷히고 새벽녘 경찰차가 저택에 도착합니다.</p>
              ` : `
                <h4 class="font-bold text-red-400">엔딩 B : 억울한 희생양과 완전범죄 (진범 엘레나 승리)</h4>
                <p>무고한 용의자에게 살인자의 낙인이 찍혀 체포되었습니다. 모두가 떠난 서재 난로 앞에서, 주치의 엘레나는 협박 편지와 독극물 앰플을 불길 속에 던져 넣으며 차분히 미소 지었습니다. 완전범죄가 완성된 저택에 섬뜩한 침묵만이 감돕니다.</p>
              `}
            </div>

            <!-- Epilogues -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
              <div class="p-3 rounded-lg bg-black/40 border border-zinc-800">
                <span class="font-bold text-amber-200">🎩 아서 윈체스터</span>
                <p class="text-zinc-400 mt-1">${isCorrect ? '누명은 벗었으나 금고 절도 미수로 유산 상속이 동결되어 빚쟁이들을 피해 해외로 야반도주했습니다.' : '억울하게 교수형에 처해지는 비극을 맞이했습니다.'}</p>
              </div>
              <div class="p-3 rounded-lg bg-black/40 border border-zinc-800">
                <span class="font-bold text-amber-200">🕯️ 노집사 찰스</span>
                <p class="text-zinc-400 mt-1">유언장 훼손 혐의로 가벼운 처벌을 받았으나 평생을 바친 저택을 쫓겨나 쓸쓸히 은퇴했습니다.</p>
              </div>
              <div class="p-3 rounded-lg bg-black/40 border border-zinc-800">
                <span class="font-bold text-amber-200">🥀 비올라 윈체스터</span>
                <p class="text-zinc-400 mt-1">남편의 진짜 기부 유언장이 복원되며 위자료 한 푼 받지 못한 채 런던 극단으로 복귀했습니다.</p>
              </div>
              <div class="p-3 rounded-lg bg-black/40 border border-zinc-800">
                <span class="font-bold text-amber-200">🩺 엘레나 바스커빌</span>
                <p class="text-zinc-400 mt-1">${isCorrect ? '종신형을 선고받고 감옥에 수감되어 의사 면허를 영구 박탈당했습니다.' : '에드워드의 유산을 관리하며 런던 사교계의 명망 높은 귀족 의사로 군림합니다.'}</p>
              </div>
            </div>
          </div>
        `;
      },

      formatTime(seconds) {
        const m = Math.floor((seconds || 0) / 60);
        const s = (seconds || 0) % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
    };

    /* ======================================================================
       3. CHARACTER SHEET & MODAL POPUPS
       ====================================================================== */
    function openCharacterSheet(charId) {
      const char = CHARACTERS.find(c => c.id === charId);
      if (!char) return;

      const content = `
        <div class="space-y-4">
          <div class="flex items-center gap-3 border-b border-amber-900/50 pb-3">
            <span class="text-4xl">${char.avatar}</span>
            <div>
              <h3 class="text-xl font-bold text-amber-200">${char.name}</h3>
              <p class="text-xs text-amber-400">${char.role} (${char.age})</p>
            </div>
          </div>

          <div>
            <h4 class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-1">나의 행적 및 타임라인</h4>
            <div class="bg-black/50 rounded-lg p-3 space-y-1.5 border border-zinc-800 text-xs">
              ${char.timeline.map(t => `
                <div class="flex gap-2">
                  <span class="font-mono text-amber-300 font-bold shrink-0">${t.time}</span>
                  <span class="text-zinc-300">${t.text}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div>
            <h4 class="text-xs font-bold text-red-400 uppercase tracking-wider mb-1">절대 발설 금지! 나의 비밀</h4>
            <div class="bg-red-950/30 border border-red-800/60 rounded-lg p-3 text-xs text-red-200 leading-relaxed">
              ${char.secret}
            </div>
          </div>

          <div>
            <h4 class="text-xs font-bold text-amber-300 uppercase tracking-wider mb-1">롤플레잉(RP) 가이드</h4>
            <p class="text-xs text-zinc-300 bg-zinc-900/70 p-2.5 rounded border border-zinc-800 italic">
              "${char.rpGuide}"
            </p>
          </div>
        </div>
      `;
      showModal(content);
    }

    function showModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    function copyRoomCode() {
      const code = window.multiplayerEngine.roomCode;
      if (!code) return;
      const el = document.createElement('textarea');
      el.value = code;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast(`방 코드 [${code}] 가 복사되었습니다!`);
    }

    /* ======================================================================
       4. PROCEDURAL AUDIO (Atmospheric Rain & Thunder)
       ====================================================================== */
    let audioCtx = null;
    let rainNode = null;
    let rainGain = null;
    let isAudioPlaying = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const icon = document.getElementById('audioIcon');
      const text = document.getElementById('audioText');

      if (!isAudioPlaying) {
        startRainSound();
        isAudioPlaying = true;
        icon.className = "ph ph-speaker-high text-amber-400";
        text.innerText = "효과음 ON";
        triggerThunderSound();
      } else {
        stopRainSound();
        isAudioPlaying = false;
        icon.className = "ph ph-speaker-simple-slash text-zinc-400";
        text.innerText = "효과음 OFF";
      }
    }

    function startRainSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 800;

      rainGain = audioCtx.createGain();
      rainGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      whiteNoise.connect(filter);
      filter.connect(rainGain);
      rainGain.connect(audioCtx.destination);
      whiteNoise.start();
      rainNode = whiteNoise;
    }

    function stopRainSound() {
      if (rainNode) {
        try { rainNode.stop(); } catch(e){}
        rainNode.disconnect();
        rainNode = null;
      }
    }

    function triggerThunderSound() {
      if (!isAudioPlaying || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(80, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.8);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 2.0);

      document.body.classList.add('bg-zinc-800');
      setTimeout(() => document.body.classList.remove('bg-zinc-800'), 150);
    }
  </script>
